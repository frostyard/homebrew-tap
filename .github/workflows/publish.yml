name: brew pr-pull

# pull_request, not pull_request_target: from 2026-12-02 GitHub blocks
# pull_request_target in public repositories unless an Actions policy allows
# it, and the frostyard policy allows it only for the PR triage caller
# (frostyard/core docs/design/pull-request-target-policy.md). Every pull
# request head of this tap is a branch of this repository, so the job gets
# the write token below. The job skips a fork pull request, which gets a
# read-only token and cannot push.
on:
  pull_request:
    types:
      - labeled

permissions: {}

# Explicit bash runs every step with -eo pipefail. Without it, GitHub runs
# `bash -e` with no pipefail, so `cmd | tee` takes tee's status and a
# failed command passes.
defaults:
  run:
    shell: bash

jobs:
  pr-pull:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'pr-pull') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          branch: main

      - name: Delete branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
