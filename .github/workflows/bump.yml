name: Homebrew Bump

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify every stale item but push nothing and open no pull request"
        type: boolean
        default: false
      base_ref:
        description: "Branch whose casks and formulae are checked, and the base of the pull requests"
        type: string
        default: main

permissions: {}

concurrency:
  group: homebrew-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # setup-homebrew replaces GITHUB_WORKSPACE for a tap repository (it moves
      # its tap clone there), so it must run before any checkout.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9 # main

      - name: Check out the workflow
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check out the tap
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.base_ref || 'main' }}
          path: tap
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump casks and formulae
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          BASE_REF: ${{ inputs.base_ref || 'main' }}
        run: |
          args=(--tap-dir tap --base-ref "$BASE_REF")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/bump_casks.py "${args[@]}"
