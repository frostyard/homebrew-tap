name: CI

# bump.yml starts this workflow on a bump branch with workflow_dispatch: a
# pull request that GITHUB_TOKEN opens starts no pull_request run, so the bump
# PR would get no `Test` check (issue #42).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Explicit bash runs every step with -eo pipefail. Without it, GitHub runs
# `bash -e` with no pipefail, so `cmd | tee` takes tee's status and a
# failed command passes.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools come from mise.toml and mise.lock (core ADR-0043), the same
      # set a developer gets from `mise install`.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - run: make ci
