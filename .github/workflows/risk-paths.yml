# PR triage (core ADR-0068, ADR-0077, ADR-0078, docs/specs/pr-triage.md): this
# caller runs on pull_request_target, so the trusted workflow from the base
# branch executes. It checks out nothing and runs no code from the pull
# request. `levels` adds 1 level label, level:L1 to level:L4, and the paths of
# .github/risk-paths.json set it; L1 and L2 also add risk:high. `readiness`
# removes ready-for-human when the head moves after the label, or when CI is not
# green at the label. `shadow` writes 1 "would auto-merge" comment on some
# Dependabot pull requests; it never merges. It is not a required check. It is
# pinned to a full core commit SHA (core ADR-0021).
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

# Explicit bash runs every step with -eo pipefail. Without it, GitHub runs
# `bash -e` with no pipefail, so `cmd | tee` takes tee's status and a
# failed command passes.
defaults:
  run:
    shell: bash

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@981e7aeb014cbd3efee710e99a5043fcc4763446 # frostyard/core main, 2026-11-14 (core#246)
